# Guild switches. Every key is on by default; this file also declares the known keys. Git
# handling is not a conf key: it is set by the plugin option only (install prompt or /config).
# Override in ~/.claude/guild.conf (user) or <project>/.claude/guild.conf (project, wins over
# user).
# Grammar: `key = value`, value on|off|true|false|yes|no; any other line is ignored.

# off: drop the Reply style section (terse replies) from the always-on context.
style.terse = on
# off: drop the Universal code rules section from the always-on context.
rules.universal = on
# off: do not inject the DAG walk at session start; only /guild loads it.
procedure.default_mode = on
# off: the architect may be dispatched without an investigator site map.
procedure.investigate_first = on
# off: skip Step 3a (vanilla Plan agent options) on the architect route.
procedure.design_gate = on
# off: no forced split of work over 12 files or more than one area into parallel slices.
procedure.sharding = on
# off: drop the cleanup pass mode at phase close.
procedure.cleanup_pass = on
# off: no guild:reviewer pass on every passed edit.
review.norms = on
# off: no code-review skill pass on substantive diffs.
review.correctness = on
# off: no guild:security diff gate; security-relevant diffs ship without a security review.
review.security = on
# off: no docs sync step at phase close.
docs.sync = on
# off: no per-prompt reinforcement line.
hooks.prompt_reinforce = on
# off: emoji in written files are no longer rejected.
hooks.emoji_scan = on
# off: guild subagents may stop without a terminal token on line 1.
hooks.receipt_check = on
